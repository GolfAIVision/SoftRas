[build-system]
requires = ["setuptools>=61.0", "wheel", "torch"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "soft-renderer"
version = "1.0.0"
description = "PyTorch implementation of \"Soft Rasterizer\""
readme = "README.md"
authors = [
    {name = "Shichen Liu", email = "liushichen95@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch>=2.8.0",
    "torchvision",
    "scikit-image",
    "tqdm",
    "imageio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ShichenLiu/SoftRas"
Repository = "https://github.com/ShichenLiu/SoftRas"

[tool.setuptools]
packages = ["soft_renderer", "soft_renderer.cuda", "soft_renderer.functional"]

[tool.setuptools.package-data]
soft_renderer = ["*.cu", "*.cpp"]
